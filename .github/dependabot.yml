# Monthly, grouped and limited, so updates arrive as a few pull requests that CI checks first.
# Major versions are left out: they need reading the upgrade guide (Next.js especially).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 3
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Pinned on purpose with the overrides in package.json (playwright-core 1.63.0): update by hand.
      - dependency-name: "@playwright/test"
      - dependency-name: "playwright-core"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      github-actions:
        patterns: ["*"]
